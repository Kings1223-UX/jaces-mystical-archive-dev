
name: Deploy development preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: development-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install database dependencies
        run: |
          python -m pip install ijson

      - name: Generate expanded Scryfall database
        run: |
          python scripts/update_cards.py

      - name: Validate expanded database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("public")
          cards_path = root / "cards.json"
          version_path = root / "database-version.json"

          if not cards_path.is_file():
              raise RuntimeError("cards.json was not generated")

          if not version_path.is_file():
              raise RuntimeError(
                  "database-version.json was not generated"
              )

          with version_path.open(encoding="utf-8") as f:
              version = json.load(f)

          if version.get("schema_version") != 2:
              raise RuntimeError(
                  "Expected database schema version 2"
              )

          with cards_path.open(encoding="utf-8") as f:
              cards = json.load(f)

          if not isinstance(cards, list) or len(cards) < 1000:
              raise RuntimeError("Invalid card database")

          required = (
              "name",
              "type_line",
              "oracle_text",
              "mana_cost",
              "cmc",
              "color_identity",
              "legalities",
              "oracle_id",
              "id",
          )

          sample = next(
              (
                  c for c in cards
                  if c.get("name") == "Sol Ring"
              ),
              None
          )

          if sample is None:
              raise RuntimeError("Sol Ring not found")

          missing = [k for k in required if k not in sample]

          if missing:
              raise RuntimeError(
                  f"Missing required fields: {missing}"
              )

          print("Database validation successful")
          print("Schema version:", version["schema_version"])
          print("Total cards:", len(cards))
          print("Sample card:", sample["name"])
          PY

      - name: Prepare website
        run: |
          mkdir -p _site

          cp index.html _site/
          cp public/cards.json _site/
          cp public/database-version.json _site/

          if [ -d src ]; then
            cp -R src _site/
          else
            echo "ERROR: src directory missing"
            exit 1
          fi

          if [ -f codex-security-test.html ]; then
            cp codex-security-test.html _site/
          fi

          test -f _site/src/codex/codexPage.js
          test -f _site/src/codex/deckStats.js
          test -f _site/src/styles/codex-v16.css

          echo "Development website prepared."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
